# The example questions of the first page, replayed from their cassette: no key, no network.
#
# A cassette holds the exact request (prompt, schema, catalog) and the answer streamed back. Any
# change to the request makes the replay fail rather than show a stale answer: re-record.
#   recorded: live      a model wrote the answer: `make cassette q=<id>`, with a key in .env.local
#   recorded: scripted  the answer was written by hand (`script`), streamed in the format of the
#                       provider, to show the page before a model is recorded:
#                       `make cassette q=<id> scripted=1`
- id: busiest-south
  text: "Which is busiest for hotels: Spain, Italy or Greece?"
  provider: anthropic
  model: "claude-sonnet-5-5"
  cassette: demo/cassettes/busiest-south.json
  recorded: live
  recorded_on: '2026-11-21'
  script: demo/scripts/busiest-south.json

- id: portugal-recovery
