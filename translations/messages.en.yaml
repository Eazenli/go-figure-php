# The interface in English. Short texts are their own key (no entry needed); paragraphs have a key.
"site.description": "A generative UI that cannot make up a number: every figure on the page is read and proven by the server."
"nav.label": "Main"
"nav.language": "Language"
"import.lead": "Add data to the catalog of this machine, then draw it, compare it or ask about it: a Eurostat dataset among some 2,700, an indicator of the World Bank for the whole world, or the weather of a city. For Eurostat you choose the dataset and fix every dimension but the place and the period. The server checks every code and reads every value from the source itself, with the date of the import. Needs internet."
"import.review": "Only the place and the period vary: choose one code for every other dimension. The title, the scope and the pitfalls are shown with the figures: no digits and no numbers in words."
"import.added": "%places% places, from %from% to %to%, read from Eurostat now. Every figure links to its proof, like the shipped ones."
"import.agent": "An agent searches Eurostat, reads the dimensions of a dataset and proposes the entry. It names codes and writes words, never a value; you review the proposal before anything is imported."
"import.agent.key": "An agent can propose the dataset for you with a key of your own: set"
"import.search": "Searches the titles of Eurostat's datasets, without any AI."
"import.help.title": "What one figure counts, in plain words."
"import.help.scope": "What the figures count and what they leave out."
"import.help.unit": "Written after each figure, with the words of the dataset itself: \"arrivals\", \"nights\". Without a scale: \"thousand\" or \"million\" is added from the unit code."
"import.help.pitfalls": "At most three, one per line."
"proof.panel.reading": "Reading the proof…"
"proof.panel.open": "Open the proof page"
"proof.panel.close": "Close the proof"
"proof.panel.label": "Proof of a figure"
"home.judge": "Go Figure does not judge what anyone says. It stops the model from writing a number: every figure on the page is read from its source, or refused."
"home.mcp.endpoint": "The MCP server listens on"
"home.mcp.hosts": "Hosts that show MCP Apps display the page; the others get it as text where every figure links to its proof, with a link to the whole page. The README explains how to connect Claude Desktop, Claude Code, VS Code, Cursor or a Hugging Face tiny agent."
"ask.stream.hint": "Not checked: the model's own words. The server never shows a value it writes; a period it names is shown only where the data has it."
"compare.lead": "Pick a few destinations and a month: every indicator of the catalog, side by side. The server reads every value from the data snapshot and links it to its proof. No AI is involved."
"compose.lead": "Pick an indicator, places and periods. The server reads every value from the data snapshot and links it to its proof. No AI is involved."
"lie.lead": "A model draws a page by sending a layout. The layout names cells of the data (a dataset, a place, a period) and never holds a value. The server reads each value from the data snapshot and links it to its proof, or refuses it. Edit the layout and try to get a number onto the page that the server did not prove."
lie.limits.words: The words are the model's own.
lie.limits.refused: digits, numbers in English or French words (whole, joined, accented, or with letters Unicode lists as look-alikes, and multipliers such as "tripled" or "décuplé"), number signs and invisible characters, web addresses and emoji codes.
lie.limits.through: a few common words that can count ("one", "first", "un", "premier", "half", "moitié", "double", "triple" (so the French "triplé", the same without its accent), "quarter", "quart", "score"), short forms such as "k" or "grand", Roman numerals written with letters ("XII"), spellings broken on purpose ("t w e l v e", "tvvelve"), and numbers in other languages.
"lie.limits.meaning": "Words can still change what a figure means: \"more than\", \"per night\"."
"lie.limits.period": "A period is shown as written, as long as the data has such a period."
"lie.limits.cell": "The server proves the value of the cell the model named, not that it is the right cell for the question."
"p.words": "Every figure was read again from the data snapshot when this page opened, and links to its proof. The words around them come with the link, from a model or from whoever made it: the server only checks that they hold no number, and"
": ": ": "
"lie.limits.places": "A place name holding a number word (\"Pont Neuf\", \"Les Deux Alpes\") is hidden too, as is an ordinary word that is also a number (\"neuf\", new in French; the verb \"seize\"): the refusal errs on the side of caution."
"proof.canonical.hint": "The link carries this form of the proof; the server recomputes it from its snapshot, and shows the proof only if both match. Its fingerprint identifies it."
# The home page (editorial pass).
proof.imported: Imported from Eurostat on %date% on this machine. The value is Eurostat's; the title, scope and unit were written by a visitor or a model, not by Go Figure.
import.city: 'One request to Open-Meteo, from this machine: thirty years of daily values, averaged here into the normals of each month. Counted on the free quota of your address: about a dozen cities a day. No AI.'
city.off_centre: The point of this city is known to lie well outside its centre, so these figures can differ from the weather of the centre.
import.city.added: Its normals were computed here from the daily values of Open-Meteo, and each figure links to the request that returns them.
proof.city: The weather of this city was added on this machine on %date%, from one request to Open-Meteo; its point is the label point of the city, which can lie some way from the centre.
proof.computed.note: 'Each cell above links to its own proof: its source, its dates, its fingerprint. The result is not rounded in the proof; the page rounds it for display.'
"home.ask.placeholder": "Is Lisbon or Seville warmer in September?"
proof.imported.world_bank: "Imported from the World Bank on %date% on this machine. The value is the World Bank's; the title and the unit come from the name it gives the indicator, the scope from its note. Nothing here was written by a visitor or a model."
"import.world_bank": "The whole world, by country and year (World Development Indicators): the economy, energy, the environment, agriculture, trade, science. The server reads every value from the World Bank, and writes the title and the unit from the name the World Bank gives the indicator. No AI."
"home.demo.said": "Pack your swimsuit: %place% reaches [a balmy 24 °C] in %month%."
"attack.lead": "This is what the model sent for the answer you were reading. Press an attack, or edit it by hand: the server checks it again, without any AI."
"attack.here": "Press an attack: the server checks the changed answer again, without any AI."
"copy.hint": "Plain text for a report or a slide: the figures as the server read them, where they come from, and the link that proves them again."
"attack.doubt": "Don't take our word for it: try to make it lie"
"home.nokey.title": "This install has no AI key, and it still answers."
"home.nokey.how": "Name a place, a subject and, if you like, a month or a year. Your words are matched to official statistics, and every figure is read and proven the same way."
"home.nokey.places": "%countries% countries and %cities% cities, such as %sample%. About:"
"home.nokey.key": "With an AI key (see the README), a model understands freer questions, writes a few lines around the figures, and goes and gets data that is not here yet."
"home.withkey.title": "Also works without AI: instant, and nothing is spent."
"ask.declined": "This question is outside what Go Figure answers: it reads official statistics by place and by period (prices, tourism, transport, weather, the economy, energy), and leaves out subjects about people's lives."
"versus.lead": "You do not prove that an AI is always right. You prove that the numbers it is allowed to show have a provenance you can check."
"versus.writes.what": "Who writes the number"
"versus.writes.them": "The model, after reading some pages."
"versus.writes.us": "The server. The model only names where to read it."
"versus.source.what": "What the source shows"
"versus.source.them": "A page the number is said to come from."
"versus.source.us": "Exactly where it was read: the dataset, the place, the period, the day."
"versus.missing.what": "When the data has no answer"
"versus.missing.them": "It may still give a plausible number."
"versus.missing.us": "A refusal, in full view."
"versus.again.what": "How you check a figure"
"versus.again.them": "You open the page and look for the number."
"versus.again.us": "One click: where it was read, the source, the day."
"versus.fair": "Such an assistant is usually right. What you cannot do is tell when it is not, short of checking every figure by hand."
"versus.limits": "It does not answer on every subject, only on what its data holds. And it cannot promise that the figure it read is the right one for your question: it says what each figure counts, and which of your words it did not understand."
"versus.where": "A report nobody rereads line by line, a dashboard, an assistant plugged on the data of a company: wherever a wrong number costs more than no number."
"home.example.lead": "A page as a model would send it, checked against the source data."
"home.outcome.proven": "The number was read from a real source. Click it to see where it comes from, and the day it was read."
"home.outcome.cell": "The source has no data for this place. No number is invented to fill the gap."
"home.outcome.text": "The model wrote a number itself, with nothing in the data to read it from. The server blocked it before it could be shown."
"home.example.dare": "Change the model's output. Add fake numbers. See what the server lets through."
"home.example.question": "Is Seville warmer than Lisbon in September?"
"data.lead": "Deposit a CSV file and question it like the public statistics: the server reads each value in your file and proves it, or says it is missing. A model never writes a figure, and never receives one."
"data.kept": "These figures are now here."
"data.kept.hint": "Ask about them on the home page, by their title: with a place or a period of the file, or without any, to see the highest and the lowest."
"data.read.title": "This is what the server read"
"data.read.what": "%rows% lines, %places% places in the column “%place%”, periods in the column “%period%”, from %from% to %to%."
"data.name.title": "Name the figures"
"data.name.hint": "Words only, as the title of a chart would be: the figures come from the file. A column left without a title is not kept."
"data.rule.stays.title": "It stays here."
"data.rule.stays": "The file is read and kept on the machine that runs this page, with the other datasets added to it. It is gone when the container is created again."
"data.rule.model.title": "What a model sees."
"data.rule.model": "With an AI key, a model is told the name of the file, the title you give each column, its unit, the places and the periods. Never a value: the server reads those itself."
"data.rule.people.title": "No file about people."
"data.rule.people": "Do not deposit a file where a line is a person. A file whose columns name one (a name, an address, a date of birth) is refused; that check is no guarantee."
"proof.imported.file": "From the file %file%, column “%column%”, deposited on this machine on %date%. The value is the file's, read as written; its title and unit are the depositor's words. Fingerprint of the file (SHA-256): %sha%."
"versus.rag": "With retrieval, the model is handed passages that hold the figures, and copies them into its answer. Here the model is handed titles, places and periods, never a value: it cannot miscopy a figure it has not seen, nor leak one."
"how.lead": "A chat model is good at writing a page and bad at numbers. So here it writes the page, and never a number."
"how.step.ask.title": "You ask."
"how.step.ask": "A question in your own words."
"how.step.name.title": "The answer says what to look up."
"how.step.name": "A model (or, without a key, the words of your question) picks which figures the answer needs, for example “temperature, Seville, September”. It never writes the number."
"how.step.read.title": "The server looks it up."
"how.step.read": "Each figure is read in the data, or computed from figures that were. One the data does not have is said missing; a number the model wrote itself is not shown."
"how.step.prove.title": "Every figure has its proof."
"how.step.prove": "A click on a figure shows where it comes from: the source, the dataset, the date it was read."
"sources.lead": "The figures shipped here are public statistics about Europe. There are two ways to use others, and they do not work the same: a file of yours, or more public data."
"sources.own.for": "Figures only you have: the sales of your shops, the visits of your sites, the readings of your sensors."
"sources.own.you": "You deposit a CSV file, then give each column of numbers a title and a unit."
"sources.own.server": "It reads the values in your file, as they are written. It downloads nothing."
"sources.own.proof": "The name of your file, the column, the day it was deposited and the fingerprint of the file."
"sources.own.ai": "None is needed. With a key, a model is told the titles, the places and the periods, never a value."
"sources.public.for": "Figures a public source publishes: a Eurostat dataset, an indicator of the World Bank, the weather of one more city."
"sources.public.you": "You look for a dataset by its words and choose it. For Eurostat you also choose what it counts (one code per dimension)."
"sources.public.server": "It downloads every value from the source itself, checks every code, and writes the title and the unit from the words of the source."
"sources.public.proof": "The source, the dataset, the date of the download, and a link to the same figure at the source."
"sources.public.ai": "None is needed. With a key, an agent can look for the dataset and propose the codes; the server still reads every value."
"sources.same.title": "The same rule for both."
"sources.same": "Once added, these figures are asked about like the others, and proven the same way: the server reads each one, a model never writes it."
"sources.stays": "What you add is kept on the machine that runs this page. It is gone when the container is created again."
"sources.closed.title": "Not everything is taken."
"sources.closed": "No file about people, and no public dataset about people's lives (health, migration, justice and the like)."
"data.other": "This page is for a file of yours. For a public source (Eurostat, the World Bank, the weather of a city):"
"import.other": "This page is for public sources. For figures only you have, in a CSV file:"
"data.step.deposit.title": "Deposit."
"data.step.deposit": "Choose a CSV file. The server says what it read in it: nothing is kept yet."
"data.step.name.title": "Name."
"data.step.name": "Give each column of numbers a title and a unit, in words. A column without a title is not kept."
"data.step.ask.title": "Ask."
"data.step.ask": "On the home page, ask about a title you gave: with a place or a period of the file, or with none to see the highest."
"data.sample.caption": "An example: the sales and the visitors of three shops, by year."
"data.sample.try": "and deposit it to see the whole path."
"data.format.line": "A first line of column names, then one line per place and period (Nantes in 2023, Nantes in 2024…)."
"data.format.first": "One column says what each line is about: a place, a product, a category. It is the first column that holds neither periods nor numbers."
"data.format.period": "One column holds the period, and nothing else: years (2024) or months (2024-03)."
"data.format.numbers": "Every other column that holds only numbers is a figure, up to %columns% of them. Decimal point or comma, spaces between thousands; no currency sign or unit in a cell. An empty cell is shown as missing."
"data.format.limits": "Columns separated by semicolons, commas or tabs. Up to %kb% KB, %rows% lines and %places% places."
"why.duel.them": "%place% reaches [a balmy 24 °C] in %month%."
"why.duel.them.what": "The number is the model's. The link leads to a page: you look for the number yourself."
"why.duel.us": "%place%, %month%: [figure], the usual daily high."
"why.duel.us.what": "The number comes from the data. The server read it; a click shows where."
"mcp.lead": "Your own assistant can ask Go Figure. It gets pages back, never a number to repeat from memory."
"mcp.step.connect.title": "Connect."
"mcp.step.connect": "Give your MCP client the address above. No key, no account."
"mcp.step.ask.title": "Ask your assistant."
"mcp.step.ask": "It lists the data, says which figures it needs, and can add a public dataset. It never sends a value."
"mcp.step.page.title": "Get a page."
"mcp.step.page": "The server reads and proves every figure. Your assistant shows the page, or a text where each figure links to its proof."

proof.op.change: The second value minus the first.
proof.op.change_pct: The second value minus the first, in percent of the first.
proof.op.share: The part divided by the whole, in percent.
proof.op.rank: The place of the first value among all the values below, the highest first.
proof.operand.change.first: First value
proof.operand.change.next: Second value
proof.operand.change_pct.first: First value
proof.operand.change_pct.next: Second value
proof.operand.share.first: The part
proof.operand.share.next: The whole
proof.operand.rank.first: The value ranked
proof.operand.rank.next: Compared with
