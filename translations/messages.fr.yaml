proof.op.change_pct: La seconde valeur moins la première, en pourcentage de la première.
proof.op.share: La partie divisée par le tout, en pourcentage.
proof.op.rank: La place de la première valeur parmi toutes les valeurs ci-dessous, la plus haute en tête.
