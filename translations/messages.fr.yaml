"mcp.lead": "Votre propre assistant peut interroger Go Figure. Il reçoit des pages, jamais un nombre à répéter de mémoire."
"mcp.step.connect.title": "Brancher."
"mcp.step.connect": "Donnez l'adresse ci-dessus à votre client MCP. Ni clé, ni compte."
"mcp.step.ask.title": "Demander à votre assistant."
"mcp.step.ask": "Il liste les données, dit de quels chiffres il a besoin, et peut ajouter un jeu de données public. Il n'envoie jamais une valeur."
"mcp.step.page.title": "Recevoir une page."
"mcp.step.page": "Le serveur lit et prouve chaque chiffre. Votre assistant affiche la page, ou un texte où chaque chiffre renvoie à sa preuve."
