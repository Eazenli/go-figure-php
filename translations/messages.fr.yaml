# The interface in French (App\Http\Language). MCP answers and the text sent to the model stay in English.
"site.description": "Une interface générative qui ne peut pas inventer un chiffre : le serveur lit et prouve chaque chiffre de la page."
"nav.label": "Navigation"
"nav.language": "Langue"
"import.lead": "Ajoutez des données au catalogue de cette machine, puis dessinez-les, comparez-les ou posez une question dessus : un jeu de données d'Eurostat parmi quelque 2 700, un indicateur de la Banque mondiale pour le monde entier, ou la météo d'une ville. Pour Eurostat, vous choisissez le jeu de données et fixez chaque dimension sauf le lieu et la période. Le serveur vérifie chaque code et lit chaque valeur à la source, avec la date de l'import. Nécessite internet."
"import.review": "Seuls le lieu et la période varient : choisissez un code pour chaque autre dimension. Le titre, la portée et les pièges s'affichent avec les chiffres : ni chiffre, ni nombre en lettres. Ces textes restent en anglais, comme les fiches."
"import.added": "%places% lieux, de %from% à %to%, lus chez Eurostat à l'instant. Chaque chiffre renvoie à sa preuve, comme ceux du catalogue livré."
"import.agent": "Un agent cherche chez Eurostat, lit les dimensions d'un jeu et propose la fiche. Il désigne des codes et écrit des mots, jamais une valeur ; vous relisez la proposition avant tout import."
"import.agent.key": "Un agent peut proposer le jeu pour vous avec votre propre clé : renseignez"
"import.search": "Cherche dans les titres des jeux d'Eurostat, sans IA."
"import.help.title": "Ce que compte un chiffre, en mots simples."
"import.help.scope": "Ce que les chiffres comptent et ce qu'ils laissent de côté."
"import.help.unit": "Écrite après chaque chiffre, avec les mots du jeu lui-même : « arrivals », « nights ». Sans échelle : « thousand » ou « million » est ajouté d'après le code de l'unité."
"import.help.pitfalls": "Trois au plus, un par ligne."
"proof.panel.reading": "Lecture de la preuve…"
"proof.panel.open": "Ouvrir la page de preuve"
"proof.panel.close": "Fermer la preuve"
"proof.panel.label": "Preuve d'un chiffre"
"home.judge": "Go Figure ne juge pas ce que dit qui que ce soit. Il empêche le modèle d'écrire un chiffre : chaque chiffre de la page est lu à sa source, ou refusé."
"Your own questions: on, answered by %model%.": "Vos propres questions : activées, réponse de %model%."
"Your own questions: off, the key settings have a problem (see Ask).": "Vos propres questions : désactivées, les réglages de la clé ont un problème (voir Demander)."
"Your own questions: off, no key set.": "Vos propres questions : désactivées, aucune clé."
"Add data: Eurostat, the World Bank, a city": "Ajouter des données : Eurostat, la Banque mondiale, une ville"
"home.mcp.endpoint": "Le serveur MCP écoute sur"
"home.mcp.hosts": "Les hôtes qui affichent les MCP Apps montrent la page ; les autres la reçoivent en texte, où chaque chiffre renvoie à sa preuve, avec un lien vers la page entière. Le README explique comment brancher Claude Desktop, Claude Code, VS Code, Cursor ou un tiny agent de Hugging Face."
"ask.stream.hint": "Non vérifié : les mots du modèle. Le serveur n'affiche jamais une valeur qu'il écrit ; une période qu'il cite ne s'affiche que si les données l'ont."
"compare.lead": "Choisissez quelques destinations et un mois : tous les indicateurs du catalogue, côte à côte. Le serveur lit chaque valeur dans l'instantané des données et la relie à sa preuve. Aucune IA n'intervient."
"compose.lead": "Choisissez un indicateur, des lieux et des périodes. Le serveur lit chaque valeur dans l'instantané des données et la relie à sa preuve. Aucune IA n'intervient."
"lie.lead": "Un modèle dessine une page en envoyant une mise en page. Elle désigne des cellules des données (un jeu de données, un lieu, une période) et ne contient jamais de valeur. Le serveur lit chaque valeur dans l'instantané des données et la relie à sa preuve, ou la refuse. Modifiez la mise en page et essayez de faire afficher un chiffre que le serveur n'a pas prouvé."
lie.limits.words: Les mots sont ceux du modèle.
lie.limits.refused: les chiffres, les nombres en toutes lettres en anglais ou en français (entiers, accolés, accentués, ou écrits avec des lettres que l'Unicode tient pour des sosies, et les multiplicateurs comme « quadruplé » ou « décuplé »), les signes et les caractères invisibles, les adresses web et les codes d'emoji.
lie.limits.through: quelques mots courants qui peuvent compter (« one », « first », « un », « premier », « half », « moitié », « double », « triple » (et donc « triplé », écrit pareil sans accent), « quarter », « quart », « score »), des abréviations comme « k » ou « grand », les chiffres romains écrits en lettres (« XII »), les graphies cassées exprès (« t w e l v e », « tvvelve »), et les nombres dans d'autres langues.
"lie.limits.meaning": "Les mots peuvent encore changer le sens d'un chiffre : « plus de », « par nuit »."
"lie.limits.period": "Une période s'affiche telle qu'elle est écrite, du moment que les données ont cette période."
"lie.limits.cell": "Le serveur prouve la valeur de la cellule que le modèle a désignée, pas que c'est la bonne cellule pour la question."
"p.words": "Chaque chiffre a été relu dans l'instantané des données à l'ouverture de cette page, et renvoie à sa preuve. Les mots autour viennent avec le lien, d'un modèle ou de qui l'a fabriqué : le serveur vérifie seulement qu'ils ne contiennent aucun nombre, et"
