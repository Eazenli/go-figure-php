"how.step.ask": "Une question avec vos mots."
"how.step.name.title": "La réponse dit quoi chercher."
"how.step.name": "Un modèle (ou, sans clé, les mots de votre question) choisit les chiffres dont la réponse a besoin, par exemple « température, Séville, septembre ». Il n'écrit jamais le nombre."
"how.step.read.title": "Le serveur va le lire."
"how.step.read": "Chaque chiffre est lu dans les données, ou calculé à partir de chiffres lus. Celui que les données n'ont pas est dit manquant ; un nombre écrit par le modèle n'est pas affiché."
"how.step.prove.title": "Chaque chiffre a sa preuve."
"how.step.prove": "Un clic sur un chiffre montre d'où il vient : la source, le jeu de données, la date de lecture."
"sources.lead": "Les chiffres livrés ici sont des statistiques publiques sur l'Europe. Il y a deux façons d'en utiliser d'autres, et elles ne marchent pas pareil : un fichier à vous, ou d'autres données publiques."
"sources.own.for": "Des chiffres que vous êtes seul à avoir : les ventes de vos magasins, les visites de vos sites, les relevés de vos capteurs."
"sources.own.you": "Vous déposez un fichier CSV, puis vous donnez un titre et une unité à chaque colonne de nombres."
"sources.own.server": "Il lit les valeurs dans votre fichier, telles qu'elles sont écrites. Il ne télécharge rien."
"sources.own.proof": "Le nom de votre fichier, la colonne, le jour du dépôt et l'empreinte du fichier."
"sources.own.ai": "Aucune n'est nécessaire. Avec une clé, un modèle reçoit les titres, les lieux et les périodes, jamais une valeur."
"sources.public.for": "Des chiffres qu'une source publique publie : un jeu de données d'Eurostat, un indicateur de la Banque mondiale, la météo d'une ville de plus."
"sources.public.you": "Vous cherchez un jeu de données par ses mots et vous le choisissez. Pour Eurostat, vous choisissez aussi ce qu'il compte (un code par dimension)."
"sources.public.server": "Il télécharge chaque valeur à la source, vérifie chaque code, et écrit le titre et l'unité avec les mots de la source."
"sources.public.proof": "La source, le jeu de données, la date du téléchargement, et un lien vers le même chiffre à la source."
"sources.public.ai": "Aucune n'est nécessaire. Avec une clé, un agent peut chercher le jeu de données et proposer les codes ; le serveur lit quand même chaque valeur."
"sources.same.title": "La même règle pour les deux."
"sources.same": "Une fois ajoutés, ces chiffres s'interrogent comme les autres et se prouvent de la même façon : le serveur lit chacun, un modèle ne l'écrit jamais."
"sources.stays": "Ce que vous ajoutez est gardé sur la machine qui fait tourner cette page. Tout disparaît quand le conteneur est recréé."
"sources.closed.title": "Tout n'est pas accepté."
"sources.closed": "Aucun fichier sur des personnes, et aucun jeu de données public sur la vie des personnes (santé, migration, justice et sujets voisins)."
"data.other": "Cette page sert à un fichier à vous. Pour une source publique (Eurostat, la Banque mondiale, la météo d'une ville) :"
"import.other": "Cette page sert aux sources publiques. Pour des chiffres que vous êtes seul à avoir, dans un fichier CSV :"
"data.step.deposit.title": "Déposer."
"data.step.deposit": "Choisissez un fichier CSV. Le serveur dit ce qu'il y a lu : rien n'est encore gardé."
"data.step.name.title": "Nommer."
"data.step.name": "Donnez un titre et une unité à chaque colonne de nombres, avec des mots. Une colonne sans titre n'est pas gardée."
"data.step.ask.title": "Demander."
"data.step.ask": "Sur la page d'accueil, posez une question avec un titre que vous avez donné : avec un lieu ou une période du fichier, ou sans, pour voir les plus hauts."
"data.sample.caption": "Un exemple : les ventes et les visiteurs de quelques magasins, par année."
"data.sample.try": "et déposez-le pour voir tout le parcours."
"data.format.line": "Une première ligne de noms de colonnes, puis une ligne par lieu et par période (Nantes en 2023, Nantes en 2024…)."
"data.format.first": "Une colonne dit de quoi parle chaque ligne : un lieu, un produit, une catégorie. C'est la première colonne qui ne contient ni périodes ni nombres."
"data.format.period": "Une colonne contient la période, et rien d'autre : des années (2024) ou des mois (2024-03)."
"data.format.numbers": "Toute autre colonne qui ne contient que des nombres est un chiffre, jusqu'à %columns%. Point ou virgule pour les décimales, espaces entre les milliers ; ni signe monétaire ni unité dans une cellule. Une cellule vide s'affiche comme manquante."
"data.format.limits": "Colonnes séparées par des points-virgules, des virgules ou des tabulations. Jusqu'à %kb% Ko, %rows% lignes et %places% lieux."
