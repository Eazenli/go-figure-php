; PHP settings of the demo image (Dockerfile, "prod" stage), after php.ini-production.
; https://symfony.com/doc/current/performance.html

; Visitors need not know which PHP version runs (X-Powered-By header).
expose_php = 0

; The code never changes inside the image: no need to check the files on each request.
opcache.validate_timestamps = 0
; Load the classes Symfony lists once, when the server starts.
opcache.preload = /app/config/preload.php
; Preloading runs as this user when the server starts as root. The image runs as an unprivileged
; user (uid 10001), so this line only matters if it is ever started as root again.
opcache.preload_user = root
opcache.memory_consumption = 256
opcache.max_accelerated_files = 20000
opcache.interned_strings_buffer = 16
realpath_cache_ttl = 600
