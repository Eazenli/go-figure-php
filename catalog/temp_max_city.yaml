unit: { code: degC, label: "°C" }
scope:
  en: "Mean of the daily maximum temperature at one point of the city, over 1991-2020. CERRA reanalysis of Copernicus, adjusted by Open-Meteo to the elevation of the point."
  fr: "Moyenne de la température maximale journalière en un point de la ville, sur 1991-2020. Réanalyse CERRA de Copernicus, ajustée par Open-Meteo à l'altitude du point."
method:
  en: "Go Figure averages the daily maximum temperature of every day of that month from 1991 to 2020, from the daily values the source link returns, and rounds half up to one decimal."
  fr: "Go Figure fait la moyenne des températures maximales de tous les jours de ce mois de 1991 à 2020, d'après les valeurs journalières que renvoie le lien de la source, arrondie au dixième."
pitfalls:
  - "One point, not the whole city: the coast and the hills of a city can differ by several degrees. Lisbon's point is about 10 km north of the centre."
  - "A reanalysis, not a weather station: a weather model held close to the observations."
  - "A normal, not a forecast: an average over 30 years, and the recent years have been warmer."
  - "Cities only: a country has no figure here. The places of the dataset are its cities."
theme: weather
operations: [change, rank]
