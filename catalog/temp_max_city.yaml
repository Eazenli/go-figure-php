# Catalog entry.
# Monthly normals computed by Go Figure (data/weather.py) from the daily values of Open-Meteo, CERRA
# reanalysis, 1991-2020, downloaded on 2026-11-18 and 2026-11-19 (make weather). The points: data/cities.csv, the
# GISCO label point of each city.
id: temp_max_city
title:
  en: "Average daily maximum temperature in the city"
  fr: "Température maximale moyenne dans la ville"
source:
  provider: open_meteo
  dataset: "Historical Weather API, CERRA reanalysis"
  # {place} becomes the point of the city (geo_map): the link returns the daily values averaged.
  url: "https://archive-api.open-meteo.com/v1/archive?{place}&start_date=1991-01-01&end_date=2020-12-31&daily=temperature_2m_max&models=cerra&timezone=GMT"
  # Shown on the proof, where numbers are allowed: the full notice of the Copernicus licence (5.1.2, 5.1.3).
  licence: "Open-Meteo.com, CC BY 4.0. Contains modified Copernicus Climate Change Service information 2026. Neither the European Commission nor ECMWF is responsible for any use that may be made of the Copernicus information or data it contains."
  # Shown under every page that shows one of these figures, and on the proof. No number.
  attribution:
    - { text: "Weather data by Open-Meteo.com", url: "https://open-meteo.com/" }
    - { text: "Contains modified Copernicus Climate Change Service information" }
